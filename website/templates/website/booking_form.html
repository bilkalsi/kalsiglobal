{% extends "base.html" %}

{% block content %}

<section class="py-5">
<div class="container">

<h2 class="mb-4">Passenger Information</h2>
<p class="text-muted">
Route: <strong>{{ origin }} → {{ destination }}</strong>
</p>

<div class="card shadow p-4">

<form method="POST">
{% csrf_token %}

<input type="hidden" name="origin" value="{{ origin }}">
<input type="hidden" name="destination" value="{{ destination }}">

<!-- passenger inputs -->
<div class="row mb-3">

<div class="col-md-6">
<label>First Name</label>
<input type="text" name="first_name" class="form-control" required>
</div>

<div class="col-md-6">
<label>Last Name</label>
<input type="text" name="last_name" class="form-control" required>
</div>

</div>

<div class="row mb-3">

<div class="col-md-6">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="col-md-6">
<label>Phone</label>
<input type="text" name="phone" class="form-control" required>
</div>

</div>

<div class="row mb-3">

<div class="col-md-4">
<label>Adults</label>
<input type="number" name="adults" class="form-control" value="1">
</div>

<div class="col-md-4">
<label>Children</label>
<input type="number" name="children" class="form-control" value="0">
</div>

<div class="col-md-4">
<label>Infants</label>
<input type="number" name="infants" class="form-control" value="0">
</div>

</div>

<div class="row mb-3">

<div class="col-md-6">
<label>Departure Date</label>
<input type="date" name="departure_date" class="form-control">
</div>

<div class="col-md-6">
<label>Return Date</label>
<input type="date" name="return_date" class="form-control">
</div>

</div>

<div class="mb-3">
<label>Special Request</label>
<textarea name="special_request" class="form-control"></textarea>
</div>

<button class="btn btn-success">
Confirm Booking
</button>

</form>

</div>

</div>
</section>

{% endblock %}
