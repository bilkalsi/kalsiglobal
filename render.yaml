services:
  - type: web
    name: kalsiglobal
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn config.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      - key: DEBUG
        value: False

      - key: SECRET_KEY
        generateValue: true